<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shop</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f5f8f6;
            --surface: #ffffff;
            --text: #17241e;
            --muted: #6b7c74;
            --green: #3fa37a;
            --green-dark: #2f8462;
            --green-soft: #e1f3ea;
            --blue: #4a8fd9;
            --blue-soft: #e4eefa;
            --pink: #e0729a;
            --pink-soft: #fce6ef;
            --border: #e3eae6;
            --radius: 22px;
            --shadow: 0 2px 6px rgba(23, 36, 30, 0.04), 0 10px 30px rgba(23, 36, 30, 0.06);
            --shadow-hover: 0 4px 10px rgba(23, 36, 30, 0.06), 0 20px 44px rgba(23, 36, 30, 0.12);
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Plus Jakarta Sans", "Noto Sans Georgian", sans-serif;
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* soft floating color blobs in the background */
        .bg-blobs {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-blobs span {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.7;
            animation: float 18s ease-in-out infinite;
        }

        .bg-blobs span:nth-child(1) { width: 420px; height: 420px; background: var(--green-soft); top: -120px; left: -100px; }
        .bg-blobs span:nth-child(2) { width: 380px; height: 380px; background: var(--blue-soft); top: 10%; right: -120px; animation-delay: -6s; }
        .bg-blobs span:nth-child(3) { width: 460px; height: 460px; background: var(--pink-soft); bottom: -180px; left: 30%; animation-delay: -12s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, 30px) scale(1.05); }
            66% { transform: translate(-30px, 20px) scale(0.95); }
        }

        /* ---------- Loading screen ---------- */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            background: var(--bg);
            transition: opacity 0.5s var(--ease), visibility 0.5s var(--ease);
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-orbs {
            position: relative;
            width: 64px;
            height: 64px;
            animation: spin 1.6s linear infinite;
        }

        .loader-orbs span {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            animation: pulse 1.6s ease-in-out infinite;
        }

        .loader-orbs span:nth-child(1) { background: var(--green); top: 0; left: 22px; }
        .loader-orbs span:nth-child(2) { background: var(--blue); bottom: 4px; left: 2px; animation-delay: -0.53s; }
        .loader-orbs span:nth-child(3) { background: var(--pink); bottom: 4px; right: 2px; animation-delay: -1.06s; }

        .loader-text {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.55); }
        }

        /* ---------- Navbar ---------- */
        .site-nav {
            position: sticky;
            top: 16px;
            z-index: 100;
            margin: 16px auto 0;
            max-width: 1080px;
            width: calc(100% - 32px);
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(16px) saturate(1.4);
            -webkit-backdrop-filter: blur(16px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 999px;
            box-shadow: var(--shadow);
            padding: 10px 12px 10px 22px;
        }

        .site-nav .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        .brand-mark {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--green), var(--blue));
            box-shadow: 0 4px 12px rgba(63, 163, 122, 0.35);
            transform: rotate(-8deg);
        }

        .site-nav .nav-link {
            color: var(--muted);
            font-weight: 600;
            padding: 8px 18px !important;
            border-radius: 999px;
            transition: color 0.2s, background 0.2s;
        }

        .site-nav .nav-link:hover {
            color: var(--text);
            background: rgba(23, 36, 30, 0.04);
        }

        .site-nav .nav-link.active {
            color: var(--green-dark);
            background: var(--green-soft);
        }

        .site-nav .navbar-toggler {
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            padding: 0;
        }

        .site-nav .navbar-toggler:focus { box-shadow: 0 0 0 3px var(--green-soft); }

        @media (max-width: 991.98px) {
            .site-nav { border-radius: 26px; }
            .site-nav .navbar-nav { padding: 10px 0 6px; gap: 4px; }
        }

        /* ---------- Page entrance ---------- */
        main {
            animation: rise 0.7s var(--ease) both;
            animation-delay: 0.15s;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page {
            max-width: 1080px;
            margin: 0 auto;
            padding: 56px 20px 80px;
        }

        /* ---------- Home ---------- */
        .hero {
            text-align: center;
            padding: 110px 20px 80px;
            max-width: 720px;
            margin: 0 auto;
        }

        .hero-pill {
            display: inline-block;
            padding: 6px 16px;
            margin-bottom: 22px;
            border-radius: 999px;
            background: var(--surface);
            border: 1px solid var(--border);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--green-dark);
            box-shadow: var(--shadow);
        }

        .hero-title {
            font-weight: 800;
            font-size: clamp(2.4rem, 7vw, 4.2rem);
            line-height: 1.05;
            letter-spacing: -0.035em;
            margin-bottom: 18px;
        }

        .hero-title span {
            background: linear-gradient(90deg, var(--green), var(--blue), var(--pink));
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 6s linear infinite;
        }

        @keyframes shimmer { to { background-position: 200% center; } }

        .hero-sub {
            color: var(--muted);
            font-size: 1.15rem;
            margin-bottom: 40px;
        }

        .btn-primary {
            background: var(--text);
            border: none;
            border-radius: 999px;
            padding: 15px 36px;
            font-weight: 700;
            font-size: 1.05rem;
            box-shadow: 0 10px 24px rgba(23, 36, 30, 0.2);
            transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), background 0.25s;
        }

        .btn-primary::after {
            content: "→";
            display: inline-block;
            margin-left: 10px;
            transition: transform 0.25s var(--ease);
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background: var(--green-dark);
            transform: translateY(-3px);
            box-shadow: 0 16px 32px rgba(47, 132, 98, 0.35);
        }

        .btn-primary:hover::after { transform: translateX(4px); }

        /* ---------- Products ---------- */
        .section-head { margin-bottom: 36px; }

        .section-title {
            font-weight: 800;
            font-size: clamp(2rem, 5vw, 2.8rem);
            letter-spacing: -0.03em;
            margin-bottom: 6px;
        }

        .section-sub { color: var(--muted); margin: 0; }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 22px;
        }

        .product-card {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 26px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow: hidden;
            transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease);
            animation: rise 0.7s var(--ease) both;
            animation-delay: calc(0.2s + var(--i, 0) * 0.08s);
        }

        .product-card::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 4px;
            background: linear-gradient(90deg, var(--green), var(--blue));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }

        .product-card:hover::before { opacity: 1; }

        .product-avatar {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--blue);
            background: var(--blue-soft);
        }

        .product-card:nth-child(3n+2) .product-avatar { color: var(--green-dark); background: var(--green-soft); }
        .product-card:nth-child(3n+3) .product-avatar { color: #b8456f; background: var(--pink-soft); }

        .product-name {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 0;
        }

        .product-price {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin: 0;
            margin-top: auto;
        }

        .product-price small {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 0;
        }

        .tag {
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: "Noto Sans Georgian", sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 7px 14px;
            border-radius: 999px;
            margin: 0;
        }

        .tag::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        .tag-expensive { background: var(--pink-soft); color: #b8456f; }
        .tag-budget { background: var(--green-soft); color: #2c7d5c; }

        /* respect users who turn off animations */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<!-- Loading screen -->
<div id="loader">
    <div class="loader-orbs"><span></span><span></span><span></span></div>
    <div class="loader-text">Loading</div>
</div>

<!-- Background decoration -->
<div class="bg-blobs"><span></span><span></span><span></span></div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light site-nav">
    <a class="navbar-brand" href="{% url 'home' %}">
        <span class="brand-mark"></span>
        Shop
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{% url 'home' %}">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if '/products' in request.path %}active{% endif %}" href="{% url 'products' %}">Products</a>
            </li>
        </ul>
    </div>
</nav>

<main>
{% block content %}


{% endblock %}
</main>

<script>
    const loader = document.getElementById("loader");

    // hide the loader once the page has finished loading
    window.addEventListener("load", () => {
        setTimeout(() => loader.classList.add("hidden"), 350);
    });

    // hide it again when coming back with the browser's back button
    window.addEventListener("pageshow", (e) => {
        if (e.persisted) loader.classList.add("hidden");
    });

    // show the loader when clicking a link to another page on this site
    document.querySelectorAll("a[href]").forEach((link) => {
        link.addEventListener("click", (e) => {
            const url = new URL(link.href, location.href);
            const samePage = url.pathname === location.pathname;
            if (url.origin !== location.origin || samePage || link.target === "_blank" || e.ctrlKey || e.metaKey) return;

            e.preventDefault();
            loader.classList.remove("hidden");
            setTimeout(() => (location.href = link.href), 300);
        });
    });
</script>

</body>
</html>
